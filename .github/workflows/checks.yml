name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the level viewer dependency
        run: python -m pip install Pillow
      - name: Run synthetic reader tests
        run: python -m unittest
      - name: Check the documentation index
        run: python tools/doc_index.py --check
      - name: Check repository contents
        run: python tools/repo_guard.py --check
